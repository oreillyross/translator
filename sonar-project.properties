sonar.projectKey=oreillyross_translator

# Drizzle-generated migration artifacts (SQL + JSON snapshots/journal) are
# never hand-written — they're regenerated by `drizzle-kit generate` and
# inherently repeat each table's boilerplate (id/createdAt/etc across
# tables), which skews duplication and complexity metrics for code nobody
# actually authored or reviews line-by-line.
sonar.exclusions=**/migrations/**
sonar.cpd.exclusions=**/migrations/**
